      <stop stop-color="#13222d"/>
      <stop offset="1" stop-color="#0a121c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1b303a"/>
      <stop offset="1" stop-color="#12212c"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#6bd8cf" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#6bd8cf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="780" rx="24" fill="url(#background)"/>
  <ellipse cx="1200" cy="200" rx="380" ry="300" fill="url(#light)"/>
