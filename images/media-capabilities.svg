    <g fill="#b5c9d2" font-size="19">
      <text x="90" y="333"><tspan x="90">Generate, edit, and refine</tspan><tspan x="90" dy="29">images for a defined brief.</tspan></text>
      <text x="538" y="333"><tspan x="538">Prepare data and iterate</tspan><tspan x="538" dy="29">a consistent character or style.</tspan></text>
      <text x="986" y="333"><tspan x="986">Develop short clips from</tspan><tspan x="986" dy="29">still-image references.</tspan></text>
      <text x="90" y="603"><tspan x="90">Shape voice and audio through</tspan><tspan x="90" dy="29">review and refinement.</tspan></text>
      <text x="538" y="603"><tspan x="538">Select and configure tools for</tspan><tspan x="538" dy="29">memory, speed, and cost.</tspan></text>
      <text x="986" y="603"><tspan x="986">Review artifacts, consistency,</tspan><tspan x="986" dy="29">and delivery requirements.</tspan></text>
    </g>
    <path d="M65 720H1375" stroke="#304753"/>
