<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
  <title id="title">Generative media capabilities</title>
  <desc id="description">Six areas of generative-media engineering: photo, image LoRA, image-to-video, voice and audio, GPU workflows, and quality review. This is a general capabilities overview.</desc>
  <defs>
